# Builds the Windows installer and attaches it to a GitHub release.
#
# This exists because building locally on Windows needs a privilege most
# machines do not grant: electron-builder's code-signing bundle contains macOS
# symlinks, and extracting it fails with "a required privilege is not held by
# the client" unless Developer Mode is on. That failure is silent in the way
# that matters — the build still produces a Nova.exe, but `rcedit` never runs,
# so the app ships with Electron's own icon and version. A runner has neither
# restriction, so the release build happens here.
#
# Windows only, deliberately. macOS and Linux builds were tried and failed, and
# publishing a build nobody has run is worse than not publishing one; add them
# back when there is someone on those platforms to confirm the result.
#
# Triggered by pushing a version tag, which is what docs/RELEASING.md already
# says a release is:
#
#   git tag -a v1.2.3 -m "..." && git push origin v1.2.3
#
# It can also be started by hand from the Actions tab, which builds the current
# branch and attaches the result to the run without publishing a release.
name: Release

on:
  push:
    tags:
      - 'v*'
    # Also on main, so a break in the build is found on the commit that caused
    # it rather than on the tag that was supposed to ship it.
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      # The gate. This has to pass for a build to be worth publishing.
      - name: Typecheck
        run: npm run typecheck

      # Reported, not gating. Two suites fail on Windows for reasons that have
      # nothing to do with the build — `test-hardening` needs the privilege to
      # create symlinks, and `test-index` resolves symbols differently here —
      # and both failed identically before any of this release's changes. Read
      # the output; do not let it silently block a release it has no opinion on.
      - name: Tests (reported, not gating)
        continue-on-error: true
        run: npm run test:offline

      - name: Build the app
        # `--dir` stops at the unpacked application, which is the build that has
        # actually been run and checked by hand. Unsigned, because there is no
        # certificate here and a build that says so beats one that fails looking
        # for one.
        #
        # electron-builder's exit code is not the question being asked. It ends
        # non-zero when a post-processing step fails — extracting the bundle that
        # holds `rcedit` needs permission to create symlinks, and that is exactly
        # what a machine without Developer Mode refuses — and it has already
        # written a complete application by then. So what is checked is whether
        # an app came out, and then, in the next step, whether it is Nova's.
        shell: pwsh
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: |
          npx electron-builder --win --dir --publish never
          $builder = $LASTEXITCODE
          if (-not (Test-Path release/win-unpacked/Nova.exe)) {
            throw "electron-builder exited $builder and produced no application"
          }
          Write-Output "electron-builder exited $builder; the application was produced"
          exit 0

      - name: Stamp the app with Nova's name, version and icon
        # electron-builder's own copy of rcedit could not be extracted, here or
        # on a developer's machine, so this does it with rcedit as an ordinary
        # dependency. Without it the executable keeps Electron's identity.
        run: node scripts/stamp-windows.mjs

      - name: Check the build carries Nova's own identity
        # The whole reason this workflow exists. `rcedit` lives inside a bundle
        # that will not extract without permission to create symlinks, and when
        # it is skipped the build still succeeds - and ships as "Electron", with
        # Electron's icon. Failing loudly here is the point.
        shell: pwsh
        run: |
          $exe = Get-Item release/win-unpacked/Nova.exe
          $name = $exe.VersionInfo.ProductName
          Write-Output "ProductName=$name ProductVersion=$($exe.VersionInfo.ProductVersion)"
          if ($name -ne 'Nova') { throw "Nova.exe reports ProductName '$name' - rcedit did not run" }

      - name: Package it
        shell: pwsh
        run: |
          $version = (Get-Content package.json | ConvertFrom-Json).version
          Compress-Archive -Path release/win-unpacked/* -DestinationPath "release/Nova-$version-win-x64.zip"
          Get-ChildItem release/*.zip | Select-Object Name, Length

      - uses: actions/upload-artifact@v4
        with:
          name: nova-windows
          if-no-files-found: error
          path: |
            release/*.zip
            release/*.exe

  publish:
    # Only a tag makes a release; a manual run just leaves the artefact above.
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*
          generate_release_notes: true
          fail_on_unmatched_files: true
