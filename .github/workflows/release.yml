# Builds the installers and attaches them to a GitHub release.
#
# This exists because building locally on Windows needs a privilege most
# machines do not grant: electron-builder's code-signing bundle contains macOS
# symlinks, and extracting it fails with "a required privilege is not held by
# the client" unless Developer Mode is on. A runner has no such problem, so the
# release build happens here and nobody has to change a system setting to cut
# one.
#
# Triggered by pushing a version tag, which is what docs/RELEASING.md already
# says a release is:
#
#   git tag -a v1.2.3 -m "..." && git push origin v1.2.3
#
# It can also be started by hand from the Actions tab, which builds the current
# branch without publishing anything.
name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      # One platform failing should still let the others produce their artefact,
      # rather than leaving a release with nothing attached at all.
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact: nova-windows
          - os: macos-latest
            artifact: nova-macos
          - os: ubuntu-latest
            artifact: nova-linux

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Typecheck and test
        # The suites that need external tooling (clangd, rust-analyzer, debugpy)
        # are not installed here, so only the offline ones run.
        run: |
          npm run typecheck
          npm run test:offline

      - name: Build
        # Unsigned: there is no certificate in this repository, and a build that
        # says so is better than one that fails looking for one.
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx electron-builder --publish never

      - name: Collect the installers
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          if-no-files-found: error
          path: |
            release/*.exe
            release/*.dmg
            release/*.AppImage
            release/*.deb
            release/*.zip

  publish:
    # Only a tag makes a release; a manual run just leaves the artefacts above.
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*
          generate_release_notes: true
          fail_on_unmatched_files: true
